# config/packages/security.yaml
security:
    password_hashers:
        App\Entity\Users:
            algorithm: auto

    providers:
        app_user_provider:
            entity:
                class: App\Entity\Users
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        main:
            lazy: true
            provider: app_user_provider

            custom_authenticators:
            - App\Security\GoogleAuthenticator

            form_login:
                login_path: app_login
                check_path: app_login
                default_target_path: app_front
                always_use_default_target_path: true

            logout:
                path: app_logout
                target: app_front

            entry_point: form_login

    access_control:
    # Public routes (keep what you actually have)
    - { path: ^/login, roles: PUBLIC_ACCESS }
    - { path: ^/register, roles: PUBLIC_ACCESS }
    - { path: ^/front, roles: PUBLIC_ACCESS }
    - { path: ^/reset-password, roles: PUBLIC_ACCESS }
    - { path: ^/connect/google, roles: PUBLIC_ACCESS }
    - { path: ^/connect/google/check, roles: PUBLIC_ACCESS }
    - { path: ^/verify/email, roles: PUBLIC_ACCESS }

    # Dashboard: only Enseignant + Admin
    - { path: ^/dashboard, roles: [ROLE_ENSEIGNANT, ROLE_ADMIN] }

    # Everything else: must be logged in (any of the 3)
    - { path: ^/, roles: [ROLE_ETUDIANT, ROLE_ENSEIGNANT, ROLE_ADMIN] }